# JMeter coordinated workload - shared properties
# Override via -Jkey=value on command line or in CI. No hardcoded load values.

# Shared load shape (used by all squads)
rampup=10
duration=60

# Enterprise-Test.jmx: coordinated workload (one squad 100%, others 5%)
# Logic: If primary.squad == SquadX then SquadX threads = primary.threads (100%), else background.threads (5%)
primary.squad=squad_a
primary.threads=20
background.threads=1

# Per-squad thread count (used when running squad script.jmx standalone)
squad_a.threads=1
squad_b.threads=1
squad_c.threads=1
squad_d.threads=1

# Placeholder target (example.com). Override for real environments.
base.domain=example.com
base.protocol=https
base.path=/
